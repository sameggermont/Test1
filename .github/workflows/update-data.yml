name: Update game data

on:
  workflow_dispatch:      # lets you run it manually from the Actions tab
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC, keeps rankings fresh
  push:
    paths:
      - ".github/workflows/update-data.yml"   # also run when this file changes

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build game database from public sources
        run: python3 scripts/fetch_games.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/games.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update game data from public sources"
            git push
          fi
